<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>諾貝兒｜總部管理</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1 id="siteTitle">諾貝兒｜總部管理</h1><small>NoB0.02 · 總部管理 · 所有時間為台灣時間</small></header>
<main><div id="message" class="notice hidden"></div>
<section id="loginPanel" class="panel"><h2>總部登入</h2><label for="password">管理密碼</label><input id="password" type="password" autocomplete="current-password"><div class="actions"><button id="login" type="button">登入</button></div></section>
<section id="adminContent" class="hidden"><div class="panel"><h2>網頁標題</h2><label for="titleInput">加盟主頁面顯示的標題</label><input id="titleInput" maxlength="80"><div class="actions"><button id="saveTitle" type="button">儲存標題</button><button id="logout" type="button" class="outline">登出</button></div></div>
<div class="panel"><h2>門市名單</h2><div id="storeList"></div><div class="row"><div><label for="newStore">新增門市名稱</label><input id="newStore" maxlength="60"></div><div style="align-self:end"><button id="addStore" type="button">新增門市</button></div></div></div>
<div class="panel"><h2 id="editHeading">建立集單</h2><div class="row"><div><label for="campaignTitle">集單名稱 *</label><input id="campaignTitle"></div><div><label for="enabled">狀態</label><select id="enabled"><option value="true">開放（依時間自動判定）</option><option value="false">提前關閉</option></select></div></div><div class="row"><div><label for="starts">開始日期與時間 *</label><input id="starts" type="datetime-local"></div><div><label for="ends">結束日期與時間 *</label><input id="ends" type="datetime-local"></div></div><label for="description">活動說明</label><textarea id="description"></textarea><h3>商品</h3><div id="productEditors"></div><button id="addProduct" class="outline" type="button">＋新增商品</button><div class="actions"><button id="saveCampaign" type="button">儲存集單</button><button id="newCampaign" class="outline" type="button">清空建立新集單</button></div></div>
<div class="panel"><h2>集單管理與彙總</h2><div id="adminCampaigns"></div></div></section></main>
<script src="config.js"></script><script src="common.js"></script><script src="admin.js"></script></body></html>
